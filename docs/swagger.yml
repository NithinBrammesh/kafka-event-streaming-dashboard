openapi: 3.0.0

info:
  title: Kafka Orders API
  version: 1.0.0
  description: Node-RED API for querying orders via ksqlDB

servers:
  - url: http://localhost:1880

paths:
  /orders:
    get:
      summary: Get orders by city

      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: BENGALURU

        - name: name
          in: query
          required: false
          schema:
            type: string
          example: Ipshita

        - name: limit
          in: query
          required: false
          schema:
            type: integer
          example: 10

      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

        '400':
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:

    Order:
      type: object
      properties:
        city:
          type: string
        order_id:
          type: string
        order_date:
          type: string
        buyer_name:
          type: string
        state:
          type: string
        sku:
          type: string
        description:
          type: string
        quantity:
          type: number
        amount:
          type: number
        event_time:
          type: string
        total_orders:
          type: number

    Error:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
